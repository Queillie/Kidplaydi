<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="小朋友音樂盒" />
  <title>小朋友音樂盒 - Kids iPad Launcher</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F9D45C;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Heiti TC", sans-serif;
    }

    /* 主容器：強制佔滿整個螢幕高度 */
    .app-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-color: #F9D45C;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
    }

    /* 頂部家人頭像列 */
    .top-bar {
      position: relative;
      width: 100%;
      height: 130px;
      min-height: 130px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      padding: 10px 20px;
    }

    .avatar-btn {
      display: inline-block;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 4px solid #1E1E1E;
      background-color: #FFFDF7;
      margin: 0 22px;
      padding: 6px;
      text-decoration: none;
      box-shadow: 0 4px 0 #1E1E1E;
      overflow: hidden;
    }

    .avatar-btn:active {
      -webkit-transform: translateY(3px);
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1E1E1E;
    }

    .avatar-btn svg {
      width: 76px !important;
      height: 76px !important;
      max-width: 76px !important;
      max-height: 76px !important;
      display: block;
      margin: 0 auto;
    }

    /* 右上角家長鎖按鈕 */
    .lock-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 3px solid #1E1E1E;
      background-color: #FFFDF7;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      box-shadow: 0 3px 0 #1E1E1E;
      cursor: pointer;
    }

    .lock-btn svg {
      width: 24px !important;
      height: 24px !important;
      max-width: 24px !important;
      max-height: 24px !important;
    }

    /* 白色主內容卡片區 */
    .main-board {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      margin: 0 18px 18px 18px;
      background-color: #FFFDF7;
      border: 4px solid #1E1E1E;
      border-radius: 28px;
      box-shadow: 0 6px 0 #1E1E1E;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      overflow: hidden;
    }

    /* 故事與音樂雙書架列 */
    .shelf-row {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      width: 100%;
      min-height: 210px;
      padding: 14px 16px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-box-direction: normal;
      -webkit-flex-direction: row;
      flex-direction: row;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }

    .shelf-divider {
      width: 100%;
      height: 3px;
      background-color: #1E1E1E;
    }

    /* 左側分類圓形圖示 */
    .category-badge {
      width: 64px;
      height: 64px;
      min-width: 64px;
      border-radius: 50%;
      border: 3px solid #1E1E1E;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      margin-right: 14px;
      box-shadow: 0 3px 0 #1E1E1E;
    }

    .category-badge.story {
      background-color: #DCEEFF;
    }

    .category-badge.music {
      background-color: #FFE0EC;
    }

    .category-badge svg {
      width: 32px !important;
      height: 32px !important;
      max-width: 32px !important;
      max-height: 32px !important;
    }

    /* 橫向捲動卡片軌道 */
    .cards-track {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
      padding: 6px 4px;
      font-size: 0;
    }

    .cards-track::-webkit-scrollbar {
      display: none;
    }

    /* 單張故事/音樂卡片 */
    .media-card {
      display: inline-block;
      vertical-align: middle;
      width: 175px;
      height: 195px;
      border: 3px solid #1E1E1E;
      border-radius: 22px;
      background-color: #FFFFFF;
      margin-right: 16px;
      padding: 10px;
      box-shadow: 0 4px 0 #1E1E1E;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .media-card:active {
      -webkit-transform: translateY(3px);
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1E1E1E;
    }

    .media-card.playing {
      border-color: #E63946;
      box-shadow: 0 4px 0 #E63946;
      background-color: #FFF8E7;
    }
